name: Build, Push, and Deploy

on:
  push:
    branches: ["main"]
  workflow_dispatch:

env:
  REGISTRY: ${{ secrets.REGISTRY }}
  IMAGE_REPOSITORY: ${{ secrets.IMAGE_REPOSITORY }}

jobs:
  test:
    name: Run unit and build checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "yarn"

      - name: Install frontend dependencies
        run: yarn install --frozen-lockfile --non-interactive

      - name: Build frontend
        run: yarn build

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.19"

      - name: Run Go tests
        working-directory: signalling
        run: go test ./...

  build-and-push:
    name: Build and push container image
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    outputs:
      image_uri: ${{ steps.image-metadata.outputs.uri }}
      image_latest: ${{ steps.image-metadata.outputs.latest }}
    steps:
      - uses: actions/checkout@v4

      - name: Derive image metadata
        id: image-metadata
        run: |
          if [ -z "${REGISTRY}" ]; then
            echo "REGISTRY secret must be provided" >&2
            exit 1
          fi
          if [ -z "${IMAGE_REPOSITORY}" ]; then
            echo "IMAGE_REPOSITORY secret must be provided" >&2
            exit 1
          fi
          IMAGE_URI="${REGISTRY}/${IMAGE_REPOSITORY}:${GITHUB_SHA}"
          IMAGE_LATEST="${REGISTRY}/${IMAGE_REPOSITORY}:latest"
          echo "uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"
          echo "latest=${IMAGE_LATEST}" >> "$GITHUB_OUTPUT"
          echo "IMAGE_URI=${IMAGE_URI}" >> "$GITHUB_ENV"
          echo "IMAGE_LATEST=${IMAGE_LATEST}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_URI }}
            ${{ env.IMAGE_LATEST }}

  deploy:
    name: Deploy to VM
    runs-on: ubuntu-latest
    needs: build-and-push
    if: ${{ github.ref == 'refs/heads/main' }}
    steps:
      - name: Prepare deployment directory
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            DEPLOY_DIR=${{ secrets.DEPLOY_DIR }}
            if [ -z "$DEPLOY_DIR" ]; then
              echo "DEPLOY_DIR secret must be provided" >&2
              exit 1
            fi
            mkdir -p "$DEPLOY_DIR"

      - name: Copy docker-compose file
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: deploy/docker-compose.yml
          target: ${{ secrets.DEPLOY_DIR }}

      - name: Copy environment template when missing
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            DEPLOY_DIR=${{ secrets.DEPLOY_DIR }}
            if [ -z "$DEPLOY_DIR" ]; then
              echo "DEPLOY_DIR secret must be provided" >&2
              exit 1
            fi
            if [ ! -f "$DEPLOY_DIR/.env" ]; then
              {
                printf '%s\n' "# Environment overrides for Kabootar deployment"
                printf '%s\n' "CONTAINER_NAME=kabootar"
                printf '%s\n' "WEB_PORT=80"
                printf '%s\n' "SIGNALLING_PORT=5000"
                printf '%s\n' "TURN_PORT=18937"
                printf '%s\n' "CORS_ENDPOINT=*"
                printf '%s\n' "TURN_REALM=localhost"
                printf '%s\n' "TURN_LISTEN_IP=0.0.0.0"
                printf '%s\n' "PUBLIC_IP=0.0.0.0"
                printf '%s\n' "SERVER_NAME=_"
              } > "$DEPLOY_DIR/.env"
            fi

      - name: Deploy updated container
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            if [ -z "${{ secrets.REGISTRY_USERNAME }}" ] || [ -z "${{ secrets.REGISTRY_PASSWORD }}" ]; then
              echo "Registry credentials are required for deployment" >&2
              exit 1
            fi
            DEPLOY_DIR=${{ secrets.DEPLOY_DIR }}
            if [ -z "$DEPLOY_DIR" ]; then
              echo "DEPLOY_DIR secret must be provided" >&2
              exit 1
            fi
            IMAGE_URI=${{ needs.build-and-push.outputs.image_uri }}
            IMAGE_LATEST=${{ needs.build-and-push.outputs.image_latest }}

            mkdir -p "$DEPLOY_DIR"
            docker login ${{ env.REGISTRY }} -u ${{ secrets.REGISTRY_USERNAME }} -p ${{ secrets.REGISTRY_PASSWORD }}
            docker pull "$IMAGE_URI"
            docker tag "$IMAGE_URI" "$IMAGE_LATEST"

            cd "$DEPLOY_DIR"
            export IMAGE="$IMAGE_URI"
            docker compose pull kabootar
            docker compose up -d --remove-orphans
            docker image prune -f
