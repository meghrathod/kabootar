name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  WRANGLER_SEND_METRICS: "false"

jobs:
  check:
    name: Typecheck, unit & worker tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Yarn 4 comes from the packageManager field via Corepack; enable it
      # before setup-node so the yarn cache lookup uses the right version.
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn
      - run: yarn install --immutable
      - run: yarn typecheck
      - run: yarn test
      - run: yarn build
      # Runs inside workerd with real Durable Objects.
      - run: yarn test:worker

  e2e:
    name: End-to-end (two browsers, real WebRTC)
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Yarn 4 comes from the packageManager field via Corepack; enable it
      # before setup-node so the yarn cache lookup uses the right version.
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn
      - run: yarn install --immutable
      - run: yarn build
      - run: npx playwright install --with-deps chromium
      - run: yarn test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
